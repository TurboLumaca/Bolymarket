# Example Apache virtual host for XAMPP (httpd-vhosts.conf). Adjust the paths.
# Enable mod_rewrite and AllowOverride All.
<VirtualHost *:80>
    ServerName bolymarket.localhost
    DocumentRoot "C:/xampp/htdocs/bolymarket/client"

    Alias /api "C:/xampp/htdocs/bolymarket/api/public"
    <Directory "C:/xampp/htdocs/bolymarket/api/public">
        AllowOverride All
        Require all granted
    </Directory>

    <Directory "C:/xampp/htdocs/bolymarket/client">
        Require all granted
        # Il client usa gli indirizzi con # (router hash): non servono regole di riscrittura per il client.
    </Directory>
</VirtualHost>
