# Example Apache virtual host for XAMPP (httpd-vhosts.conf). Adjust the paths.
# Enable mod_rewrite and AllowOverride All. Run "npm run build" in client/ first.
<VirtualHost *:80>
    ServerName bolymarket.localhost
    DocumentRoot "C:/xampp/htdocs/bolymarket/client/dist"

    Alias /api "C:/xampp/htdocs/bolymarket/api/public"
    <Directory "C:/xampp/htdocs/bolymarket/api/public">
        AllowOverride All
        Require all granted
    </Directory>

    <Directory "C:/xampp/htdocs/bolymarket/client/dist">
        Require all granted
        # Vue Router history mode: unknown paths return index.html
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_URI} !^/api
        RewriteRule ^ index.html [L]
    </Directory>
</VirtualHost>
