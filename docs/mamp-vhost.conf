# Virtual host for MAMP (Apache on port 8888). Append to /Applications/MAMP/conf/apache/extra/httpd-vhosts.conf
# Needs mod_rewrite and the Include of httpd-vhosts.conf enabled in httpd.conf. Run "npm run build" in client/ first.
<VirtualHost *:8888>
    ServerName bolymarket.localhost
    DocumentRoot "/Applications/MAMP/htdocs/Bolymarket/client/dist"

    Alias /api "/Applications/MAMP/htdocs/Bolymarket/api/public"
    <Directory "/Applications/MAMP/htdocs/Bolymarket/api/public">
        AllowOverride All
        Require all granted
    </Directory>

    <Directory "/Applications/MAMP/htdocs/Bolymarket/client/dist">
        Require all granted
        # Vue Router history mode: unknown paths return index.html
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_URI} !^/api
        RewriteRule ^ index.html [L]
    </Directory>
</VirtualHost>
