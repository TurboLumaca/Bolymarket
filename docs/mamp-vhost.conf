# Virtual host for MAMP (Apache on port 8888). Append to /Applications/MAMP/conf/apache/extra/httpd-vhosts.conf
# Needs mod_rewrite and the Include of httpd-vhosts.conf enabled in httpd.conf.
<VirtualHost *:8888>
    ServerName bolymarket.localhost
    DocumentRoot "/Applications/MAMP/htdocs/Bolymarket/client"

    Alias /api "/Applications/MAMP/htdocs/Bolymarket/api/public"
    <Directory "/Applications/MAMP/htdocs/Bolymarket/api/public">
        AllowOverride All
        Require all granted
    </Directory>

    <Directory "/Applications/MAMP/htdocs/Bolymarket/client">
        Require all granted
        # Il client usa gli indirizzi con # (router hash): non servono regole di riscrittura per il client.
    </Directory>
</VirtualHost>
